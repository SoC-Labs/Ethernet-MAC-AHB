# Derived from RTL: ethernet-mac-ahb/src/rtl/ethmac_ahb.v
#
# OpenCores Ethernet MAC with AHB interfaces only (no HA1588 PTP).
# Single AHB slave port for register/buffer descriptor access,
# single AHB master port for DMA.
#
# Use this module when PTP timestamping is not required.
# For combined MAC + PTP, use ethmac_subsystem_ahb instead.

module:
  name: ethmac_ahb
  gen: False
  desc: >
    OpenCores Ethernet MAC with AHB-Lite interfaces. Provides 10/100 Mbps
    MII-based Ethernet with DMA-driven buffer descriptor packet handling.
    AHB slave port for register access (bridged to internal Wishbone),
    AHB master port for DMA engine packet buffer transfers.

  params:
    SYS_ADDR_W: { type: int, default: 32, desc: "System address width" }
    SYS_DATA_W: { type: int, default: 32, desc: "System data width" }

  interfaces:
    # Clock and Reset
    - { name: HCLK,    type: wire, direction: in, params: { WIDTH: 1 }, desc: "AHB clock" }
    - { name: HRESETn, type: wire, direction: in, params: { WIDTH: 1 }, desc: "AHB reset (active low)" }

    # AHB slave port (register + buffer descriptor access)
    - { name: ahb_slave, type: ahb, direction: target, params: { ADDR_WIDTH: $SYS_ADDR_W, DATA_WIDTH: $SYS_DATA_W }, desc: "AHB slave port — Ethernet MAC registers (0x0000-0x0FFF)" }

    # AHB master port (DMA for packet transfer)
    - { name: ahb_master, type: ahb, direction: initiator, params: { ADDR_WIDTH: $SYS_ADDR_W, DATA_WIDTH: $SYS_DATA_W }, desc: "AHB master port — Ethernet MAC DMA engine" }

    # MII Transmit
    - { name: mtx_clk_i,  type: wire, direction: in,  params: { WIDTH: 1 }, desc: "MII transmit clock" }
    - { name: mtxd_o,     type: wire, direction: out, params: { WIDTH: 4 }, desc: "MII transmit data" }
    - { name: mtxen_o,    type: wire, direction: out, params: { WIDTH: 1 }, desc: "MII transmit enable" }
    - { name: mtxerr_o,   type: wire, direction: out, params: { WIDTH: 1 }, desc: "MII transmit error" }

    # MII Receive
    - { name: mrx_clk_i,  type: wire, direction: in,  params: { WIDTH: 1 }, desc: "MII receive clock" }
    - { name: mrxd_i,     type: wire, direction: in,  params: { WIDTH: 4 }, desc: "MII receive data" }
    - { name: mrxdv_i,    type: wire, direction: in,  params: { WIDTH: 1 }, desc: "MII receive data valid" }
    - { name: mrxerr_i,   type: wire, direction: in,  params: { WIDTH: 1 }, desc: "MII receive error" }

    # MII Common
    - { name: mcoll_i,    type: wire, direction: in,  params: { WIDTH: 1 }, desc: "MII collision detect" }
    - { name: mcrs_i,     type: wire, direction: in,  params: { WIDTH: 1 }, desc: "MII carrier sense" }

    # MDIO Management Interface
    - { name: md_pad_i,   type: wire, direction: in,  params: { WIDTH: 1 }, desc: "MDIO data input" }
    - { name: mdc_pad_o,  type: wire, direction: out, params: { WIDTH: 1 }, desc: "MDIO clock output" }
    - { name: md_pad_o,   type: wire, direction: out, params: { WIDTH: 1 }, desc: "MDIO data output" }
    - { name: md_padoe_o, type: wire, direction: out, params: { WIDTH: 1 }, desc: "MDIO data output enable" }

    # Interrupt
    - { name: int_o, type: wire, direction: out, params: { WIDTH: 1 }, desc: "Ethernet MAC interrupt output" }

  register_maps:
    - name: ethmac
      base_offset: 0x0000
      description: Ethernet MAC registers and buffer descriptors
