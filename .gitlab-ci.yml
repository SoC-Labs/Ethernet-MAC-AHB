    - make -C "$WORK_DIR/amba_wb_bridges/cocotb/ahb3lite_to_wb" clean
    - make -C "$WORK_DIR/amba_wb_bridges/cocotb/ahb3lite_to_wb"
  artifacts:
    when: always
    reports:
      junit: amba_wb_bridges/cocotb/ahb3lite_to_wb/results.xml
