# GitLab CI pipeline for ethernet-mac-ahb
#
# Runs HAL lint, cocotb verification suites, and ASIC synthesis flows.
# Requires a shell runner with VCS, Cadence Xcelium, and Synopsys tools.

stages:
  - setup
  - lint
  - test
  - synthesis
  # - gate-level
  - cleanup

variables:
  # Disable GitLab's built-in checkout — we clone manually
  GIT_STRATEGY: none
  # Workspace directory for the pipeline
  WORK_DIR: "${CI_BUILDS_DIR}/${CI_PROJECT_NAME}/${CI_PIPELINE_ID}"
  # External IP
  ETHMAC_IP_DIR: /research/AAA/ip_library/OpenCores-EthMAC
  HA1588_IP_DIR: /research/AAA/ip_library/OpenCores-HA1588
  # ARM CMSDK (APB mux, SRAM models)
  CMSDK_DIR: /research/AAA/ip_library/BP210/BP210-BU-00000-r1p1-00rel0
  # PTP Hardware Clock (cloned inside workspace for integration tests)
  PHC_REPO_URL: https://git.soton.ac.uk/soclabs/ptp-hardware-clock-ahb.git
  PHC_HOME: "${WORK_DIR}/deps/ptp-hardware-clock-ahb"
  # Synopsys EDA tool paths
  VCS_HOME: /eda/synopsys/2022-23/RHELx86/VCS_2022.06-SP2
  VERDI_HOME: /eda/synopsys/2022-23/RHELx86/VERDI_2022.06-SP2
  RTLA_HOME: /eda/synopsys/2022-23/RHELx86/RTL-ARCH_2022.12
  # Synopsys VC VIP (for UVM AMBA agents)
  VIP_HOME: /eda/synopsys/2022-23/RHELx86/VC-VIP-SOC_2022.12
  # Cadence Xcelium (provides HAL linter)
  XCELIUM_HOME: /eda/cadence/xcelium
  # Synopsys SpyGlass (CDC lint)
  SPYGLASS_HOME: /eda/synopsys/2022-23/RHELx86/SPYGLASS_2022.06-SP2/SPYGLASS_HOME
  # Simulator selection for cocotb
  SIM: vcs

# ── Clone ────────────────────────────────────────────────────────────────

clone:
  stage: setup
  script:
    # Remove stale workspaces from previous pipelines (older than 24h)
    - find "${CI_BUILDS_DIR}/${CI_PROJECT_NAME}" -maxdepth 1 -mindepth 1 -type d -mmin +1440 -exec rm -rf {} + 2>/dev/null || true
    - rm -rf "$WORK_DIR"
    - mkdir -p "$WORK_DIR"
    - git clone --branch "$CI_COMMIT_REF_NAME" --single-branch "$CI_REPOSITORY_URL" "$WORK_DIR"
    - cd "$WORK_DIR" && git checkout "$CI_COMMIT_SHA"
    - cd "$WORK_DIR" && git submodule update --init --recursive
    - echo "Cloned $CI_COMMIT_SHORT_SHA into $WORK_DIR"
    # Clone PHC repo inside workspace for integration tests
    - mkdir -p "$WORK_DIR/deps"
    - git clone --depth 1 "$PHC_REPO_URL" "$PHC_HOME"
    - echo "Cloned ptp-hardware-clock-ahb into $PHC_HOME"

# ── Preflight — validate all tool/IP paths before running jobs ────────

preflight:
  stage: setup
  needs: [clone]
  script:
    - |
      echo "========================================"
      echo " Preflight Environment Check"
      echo "========================================"

      pass=0; fail=0

      check_dir() {
        local name="$1" path="$2"
        if [ -z "$path" ]; then
          echo "  FAIL  $name  (not set)"
          fail=$((fail + 1))
        elif [ -d "$path" ]; then
          echo "  OK    $name = $path"
          pass=$((pass + 1))
        else
          echo "  FAIL  $name = $path  (directory not found)"
          fail=$((fail + 1))
        fi
      }

      check_bin() {
        local name="$1" bin="$2"
        if command -v "$bin" > /dev/null 2>&1; then
          echo "  OK    $name  ($(command -v "$bin"))"
          pass=$((pass + 1))
        else
          echo "  FAIL  $name  ('$bin' not found on PATH)"
          fail=$((fail + 1))
        fi
      }

      echo ""
      echo "── EDA Tools ───────────────────────────"
      check_dir "VCS_HOME"      "$VCS_HOME"
      check_dir "VERDI_HOME"    "$VERDI_HOME"
      check_dir "XCELIUM_HOME"  "$XCELIUM_HOME"
      check_dir "SPYGLASS_HOME" "$SPYGLASS_HOME"
      check_dir "RTLA_HOME"     "$RTLA_HOME"
      check_dir "VIP_HOME"      "$VIP_HOME"

      echo ""
      echo "── IP Libraries ────────────────────────"
      check_dir "ETHMAC_IP_DIR"  "$ETHMAC_IP_DIR"
      check_dir "HA1588_IP_DIR"  "$HA1588_IP_DIR"
      check_dir "CMSDK_DIR"      "$CMSDK_DIR"
      check_dir "PHC_HOME"       "$PHC_HOME"

      echo ""
      echo "── Workspace ───────────────────────────"
      check_dir "WORK_DIR"      "$WORK_DIR"

      echo ""
      echo "── Tool Binaries (with PATH set) ───────"
      export PATH="$VCS_HOME/bin:$VERDI_HOME/bin:$XCELIUM_HOME/tools/bin:$RTLA_HOME/bin:$SPYGLASS_HOME/bin:$PATH"
      check_bin "vcs"             "vcs"
      check_bin "spyglass"        "spyglass"
      check_bin "hal"             "hal"
      check_bin "python3"         "python3"
      check_bin "cocotb-config"   "cocotb-config"

      echo ""
      echo "========================================"
      echo " Preflight Summary  PASS=$pass  FAIL=$fail"
      echo "========================================"

      if [ "$fail" -ne 0 ]; then
        echo ""
        echo "ERROR: $fail preflight check(s) failed."
        echo "Fix the paths in .gitlab-ci.yml variables or on the runner."
        exit 1
      fi

# ── Lint ─────────────────────────────────────────────────────────────────

hal-lint:
  stage: lint
  needs: [clone, preflight]
  tags:
    - xcelium
  before_script:
    - export PATH="$XCELIUM_HOME/tools/bin:$PATH"
    - export AHB_BRIDGES_HOME="$WORK_DIR/amba_wb_bridges"
  script:
    - echo "HAL version:" && hal -version 2>&1 | head -1
    - make -C "$WORK_DIR/amba_wb_bridges/lint" lint-each
  after_script:
    - cp -r "$WORK_DIR/lint/"*_hal.log "$WORK_DIR/lint/"*_hal.xml . 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - "*_hal.log"
      - "*_hal.xml"
    expire_in: 30 days

spyglass-cdc:
  stage: lint
  needs: [clone, preflight]
  tags:
    - vcs
  before_script:
    - export PATH="$SPYGLASS_HOME/bin:$PATH"
    - export ETHMAC_AHB_HOME="$WORK_DIR"
    - export ETHMAC_IP_DIR="$ETHMAC_IP_DIR"
    - export HA1588_IP_DIR="$HA1588_IP_DIR"
    - export CMSDK_DIR="$CMSDK_DIR"
  script:
    - echo "SpyGlass version:" && spyglass -batch -tcl "puts [get_tool_info version]; exit" 2>&1 | tail -1 || true
    # CDC lint the full subsystem (4 clock domains: pclk, mtx_clk, mrx_clk, rtc_clk)
    - make -C "$WORK_DIR/cdc" cdc MODULE=ethmac_subsystem_apb SPYGLASS_HOME="$SPYGLASS_HOME"
    # CDC lint the MII-only variant (3 clock domains: hclk, mtx_clk, mrx_clk)
    - make -C "$WORK_DIR/cdc" cdc MODULE=ethmac_ahb SPYGLASS_HOME="$SPYGLASS_HOME"
  after_script:
    - mkdir -p spyglass_cdc
    - cp "$WORK_DIR/cdc/"*_cdc_summary.rpt spyglass_cdc/ 2>/dev/null || true
    - cp -r "$WORK_DIR/cdc/"*_spyglass/cdc_verify/spyglass_reports spyglass_cdc/ 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - spyglass_cdc/
    expire_in: 30 days

