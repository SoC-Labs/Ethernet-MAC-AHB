# ── RTL Architect ────────────────────────────────────────────────────────

rtl-architect:
  stage: synthesis
  needs: [clone, preflight]
  tags:
    - rtl_architect
  before_script:
    - export PATH="$RTLA_HOME/bin:$VCS_HOME/bin:$VERDI_HOME/bin:$PATH"
    - export ETHMAC_AHB_HOME="$WORK_DIR"
    - export ETHMAC_IP_DIR="$ETHMAC_IP_DIR"
  script:
    - echo "RTL Architect version:" && rtl_shell -version 2>&1 | head -3
    - make -C "$WORK_DIR/syn/asic/rtl-architect" ra MODULE=ethmac_ahb
  after_script:
    - mkdir -p syn/asic/rtl-architect
    - cp -r "$WORK_DIR/syn/asic/rtl-architect/ethmac_ahb_ra_reports" syn/asic/rtl-architect/ 2>/dev/null || true
    - cp    "$WORK_DIR/syn/asic/rtl-architect/ethmac_ahb_ra.log"     syn/asic/rtl-architect/ 2>/dev/null || true
    - cp -r "$WORK_DIR/syn/asic/rtl-architect/RTLA_WORK/rpts_fc"    syn/asic/rtl-architect/rpts_fc/ 2>/dev/null || true
    - cp -r "$WORK_DIR/syn/asic/rtl-architect/RTLA_WORK/logs_rtl"  syn/asic/rtl-architect/logs_rtl/ 2>/dev/null || true
  artifacts:
    when: always
